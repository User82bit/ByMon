name: Validate ByMon

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - homologa

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint, TypeScript and production build
        run: npm run build
